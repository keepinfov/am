name: PR Size Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-size-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    # Only a default-branch base can supply the trusted script and policy.
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Out Trusted Base Only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/label_pr.py
            .repo-policy.toml
          sparse-checkout-cone-mode: false
      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Label From REST Metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/label_pr.py --event "$GITHUB_EVENT_PATH"
