name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test Policy And GitHub Boundaries
        run: python3 -m unittest discover -s tests/policy -v
      - name: Check Files, Commits, Signatures And PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci.py

  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Install Checksum-Pinned Actionlint
        run: python3 scripts/install_actionlint.py --bin-dir "$RUNNER_TEMP/am-style-bin"
      - name: Check All Supported File Styles
        env:
          ACTIONLINT: ${{ runner.temp }}/am-style-bin/actionlint
        run: python3 scripts/check_style.py
      - name: Test Tooling Safety
        run: python3 -m unittest discover -s tools -v
      - name: Audit Development Dependencies
        run: npm audit --audit-level=low

  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    needs: [policy, style, rustfmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/terminal_smoke.py

  required:
    if: ${{ always() }}
    needs: [policy, style, rustfmt, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Every Gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("Unsuccessful gates: " + ", ".join(failed))
          sys.exit(bool(failed))
          PY
